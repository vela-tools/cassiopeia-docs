blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/vela-tools/cassiopeia/security/policy
    about: Never open a public issue for a vulnerability. Follow the responsible disclosure process in the Cassiopeia security policy.
  - name: Report a bug in Cassiopeia itself
    url: https://github.com/vela-tools/cassiopeia/issues/new/choose
    about: A wrong entity, a crash, or a missing feature belongs in the main repository, not here.
  - name: Report a broken example
    url: https://github.com/vela-tools/cassiopeia-examples/issues/new/choose
    about: An example that no longer runs, or no longer produces what its page says, belongs in the examples repository.
  - name: Contact Vela Tools
    url: https://velacontext.com/contactus
    about: Commercial enquiries, or anything else that should not be discussed in a public issue.

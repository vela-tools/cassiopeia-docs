name: sync-examples

# The worked example pages are written and checked in vela-tools/cassiopeia-examples
# and served from here. Each documentation version is synced from the examples
# tag of the same name, v1.0.3 for version 1.0.3, and a version with no such tag
# has no example pages. This job re-runs the sync every morning and opens a pull
# request when a version's pages have moved, which in practice means a new tag
# has been pushed for a version that already exists here.
#
# Requires "Allow GitHub Actions to create and approve pull requests" to be on
# (Settings -> Actions -> General -> Workflow permissions).

on:
  schedule:
    # Early enough that a tag pushed yesterday is waiting at the start of the day.
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: sync-examples
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: sync and open a pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The script clones cassiopeia-examples itself. That repository is public,
      # so the checkout needs no credentials.
      - name: Sync the example pages
        run: npm run sync:examples

      # A pull request opened with GITHUB_TOKEN does not start other workflows,
      # so build.yaml will not run on it. Building here instead means the pull
      # request is already known to compile, with onBrokenLinks set to throw
      # catching any link the sync rewrote wrongly.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/sync-examples
          # One long-lived branch: a second run amends the open pull request
          # rather than opening another one beside it.
          delete-branch: true
          title: "docs: sync worked examples"
          commit-message: "docs: sync worked examples"
          labels: documentation
          body: |
            Automated sync of the worked example pages from
            [vela-tools/cassiopeia-examples](https://github.com/vela-tools/cassiopeia-examples).

            The pages are generated by `npm run sync:examples`, each version from the
            examples tag of the same name; `examples.lock` records the commit each one
            came from. Edits belong in the examples repository, not in the copies under
            `versioned_docs/`.

            `npm run typecheck` and `npm run build` both passed on this branch before
            the pull request was opened.
